name: DeskCall
options:
  bundleIdPrefix: com.deskcall
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    # Sideloadly re-signs the .ipa, so CI ships it unsigned.
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    DEVELOPMENT_TEAM: ""

targets:
  DeskCall:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: DeskCall/Sources
      - path: DeskCall/Resources
        buildPhase: resources
    dependencies:
      - target: CallDirectory
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deskcall.app
        INFOPLIST_FILE: DeskCall/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"

  CallDirectory:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: CallDirectory
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deskcall.app.CallDirectory
        INFOPLIST_FILE: CallDirectory/Info.plist
    dependencies:
      - sdk: CallKit.framework

schemes:
  DeskCall:
    build:
      targets:
        DeskCall: all
    run:
      config: Debug
    archive:
      config: Release
